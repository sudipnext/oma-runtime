[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/oma-supervisord.pid
childlogdir=/tmp
umask=0077

[program:mariadb]
command=/opt/oma/mariadb.sh
priority=10
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wordpress]
command=/usr/bin/python3 /opt/oma/bootstrap.py
priority=20
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:hermes]
command=/opt/oma/hermes-entrypoint.sh
priority=30
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
