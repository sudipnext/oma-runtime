name: Test and publish runtime

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          bash -n entrypoint.sh mariadb.sh healthcheck.sh smoke-test.sh
          shellcheck entrypoint.sh mariadb.sh healthcheck.sh smoke-test.sh
          python3 -m py_compile bootstrap.py
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: oma-runtime:test
          provenance: false
      - name: Smoke test under 4 GB / 2 CPU limits
        run: bash smoke-test.sh oma-runtime:test
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker tag oma-runtime:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            docker tag oma-runtime:test "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == main ]]; then
            docker tag oma-runtime:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          echo "Published $IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
