ServerRoot /etc/apache2
IncludeOptional mods-enabled/*.load
IncludeOptional mods-enabled/*.conf
ServerName localhost
Listen 0.0.0.0:8081
PidFile /tmp/oma-apache.pid
DefaultRuntimeDir /tmp
ErrorLog /dev/stderr
LogLevel warn
# Avoid recording signed URL query parameters or credentials in access logs.
LogFormat "%h %m %U %>s" oma
CustomLog /dev/stdout oma
ServerTokens Prod
ServerSignature Off
DirectoryIndex index.php index.html
DocumentRoot "${HOME}/.oma/wordpress"

# Four PHP workers cap memory use for the 4 GB experiment.
StartServers 1
MinSpareServers 1
MaxSpareServers 2
MaxRequestWorkers 4
MaxConnectionsPerChild 500

<Directory />
    Require all denied
</Directory>
<Directory "${HOME}/.oma/wordpress">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /index.php
    <FilesMatch "^\.|^wp-config\.php$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory "${HOME}/.oma/wordpress/wp-content/uploads">
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
